name: Build and publish Agro Manejo Inteligente APK

on:
  push:
    branches: [main]
    paths:
      - 'build6/part-*.txt'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct and validate Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          cat build6/part-00.txt build6/part-00a.txt build6/part-01.txt build6/part-02.txt build6/part-03.txt build6/part-04.txt | tr -d '\n' | base64 --decode > /tmp/agro-android-project.tar.xz
          xz -t /tmp/agro-android-project.tar.xz
          tar -xJf /tmp/agro-android-project.tar.xz -C source
          test -f source/app/build.gradle
          test -f source/app/src/main/AndroidManifest.xml
          test -f source/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -n "$sdkmanager_path"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses
          set -o pipefail
          "$sdkmanager_path" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate generated APK
        working-directory: source
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agro_Manejo_Inteligente_APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Agro Manejo Inteligente APK ${{ github.run_number }}
          prerelease: true
          files: source/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
