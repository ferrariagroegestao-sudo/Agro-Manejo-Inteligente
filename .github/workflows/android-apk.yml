name: Build and publish Agro Manejo Inteligente APK

on:
  push:
    branches: [main]
    paths:
      - 'build/project-*.b64'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct Android project source
        shell: bash
        run: |
          set -euo pipefail
          cat build/project-*.b64 | base64 --decode > /tmp/agro-android-project.zip
          unzip -t /tmp/agro-android-project.zip
          unzip -q /tmp/agro-android-project.zip -d .
          test -f Agro_Manejo_Inteligente_Android_Projeto/app/build.gradle
          test -f Agro_Manejo_Inteligente_Android_Projeto/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Build debug APK
        working-directory: Agro_Manejo_Inteligente_Android_Projeto
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate generated APK
        working-directory: Agro_Manejo_Inteligente_Android_Projeto
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agro_Manejo_Inteligente_APK
          path: Agro_Manejo_Inteligente_Android_Projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Agro Manejo Inteligente APK ${{ github.run_number }}
          prerelease: true
          files: Agro_Manejo_Inteligente_Android_Projeto/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
